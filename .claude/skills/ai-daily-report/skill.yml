name: ai-daily-report
displayName: AI Daily Report Generator
description: Automated daily AI industry reports with Korean localization, compact summaries, and Desktop auto-save
version: 4.0.0
author: bwchin98-bot
repository: https://github.com/bwchin98-bot/CHIN-BONGWOO
status: Production Ready - Final Release ✅

trigger:
  - command: /ai-report
  - command: /generate-report
  - command: ai-report

aliases:
  - ai-daily-report
  - report-generator

config:
  required:
    - GITHUB_USER
    - GITHUB_EMAIL
    - GITHUB_TOKEN
    - GITHUB_REPO
  optional:
    - SCHEDULE_TIME
    - GOOGLE_NEWS_API_KEY
    - PRODUCT_HUNT_API_KEY

scripts:
  main: src/index.js
  setup: scripts/setup.sh
  cli: src/cli.js
  config: config/defaults.js

entry_point: src/index.js

features:
  phase1:
    - "✅ Breaking News (Hacker News API)"
    - "✅ Research Papers (arXiv API)"
    - "✅ GitHub Trending Repositories"
  phase2:
    - "✅ Company Updates (Hacker News filtering)"
    - "✅ Funding & Investments (Hacker News)"
    - "✅ New Models & Technologies (Hugging Face)"
    - "✅ Upcoming Events (Calendar data)"
  phase3:
    - "✅ 100% Korean Localization"
    - "✅ Compact Summary Format (1-2 lines)"
    - "✅ Desktop Auto-Save"
    - "✅ GitHub Actions Automation"
    - "✅ HTML Report Generation"
    - "✅ Archive Management"
    - "✅ GitHub Actions v5 (Node.js 24)"
    - "✅ No Dependencies Lock File Error"
  planned:
    - "⏳ Email Notifications"
    - "⏳ Slack Integration"
    - "⏳ Twitter Auto-Posting"
    - "⏳ Web Dashboard"

issueTracking:
  - number: 6
    title: "Upgrade GitHub Actions to Node.js 24"
    status: "closed"
    completed: "2026-06-11"
  - number: 2
    title: "보고서 일부 섹션에 데이터 없음"
    status: "completed"
    completed: "2026-06-11"

documentation:
  main: README.md
  complete: docs/DOCUMENTATION.md
  changelog: docs/CHANGELOG.md
  quickStart: |
    1. Run: /ai-report setup
    2. Configure GitHub credentials
    3. Run: /ai-report generate
    4. Reports saved to reports/ and Desktop/AI-Daily-Reports/
  roadmap: |
    Phase 1 (Done): Breaking News, Papers, GitHub Trending
    Phase 2 (Done): Company Updates, Funding, New Models, Events
    Phase 3 (Done): Korean Localization, Compact Format, Desktop, GitHub Actions v5
    Phase 4 (Planned): Email, Slack, Twitter, Web Dashboard
