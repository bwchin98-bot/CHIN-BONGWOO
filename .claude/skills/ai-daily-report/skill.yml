name: ai-daily-report
displayName: AI Daily Report Generator
description: Automated daily AI industry reports with Korean localization and Desktop auto-save
version: 3.0.0
author: bwchin98-bot
repository: https://github.com/bwchin98-bot/CHIN-BONGWOO

trigger:
  - command: ai-report
  - command: generate-report
  - command: /ai-report

config:
  required:
    - GITHUB_USER
    - GITHUB_EMAIL
    - GITHUB_TOKEN
    - GITHUB_REPO
  optional:
    - SCHEDULE_TIME
    - GOOGLE_NEWS_API_KEY
    - PRODUCT_HUNT_API_KEY

scripts:
  setup: setup.sh
  run: run.js

features:
  working:
    - "✅ Breaking News (Hacker News API)"
    - "✅ Research Papers (arXiv API)"
    - "✅ GitHub Trending Repositories"
    - "✅ Automatic GitHub Push"
    - "✅ HTML Report Generation"
    - "✅ Archive Management"
    - "✅ GitHub Actions Automation"
  planned:
    - "⏳ Company Updates (Hacker News filtering)"
    - "⏳ Funding & Investments (Product Hunt)"
    - "⏳ New Models & Technologies (Hugging Face)"
    - "⏳ Upcoming Events (Calendar integration)"

issueTracking:
  - number: 2
    title: "보고서 일부 섹션에 데이터 없음"
    status: "in-progress"
    planned: true

documentation:
  main: README.md
  quickStart: |
    1. Run: node .claude/skills/ai-daily-report/run.js setup
    2. Configure GitHub credentials
    3. Run: node .claude/skills/ai-daily-report/run.js generate
    4. Report saved to reports/ folder
  roadmap: |
    Phase 1 (Done): Breaking News, Papers, GitHub Trending
    Phase 2 (Planned): Company Updates, Funding, New Models
    Phase 3 (Future): Email alerts, Slack integration, Twitter posting
